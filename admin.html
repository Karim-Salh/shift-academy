<div id="login" class="wrap" style="max-width:400px;margin-top:12vh"><div class="card"><h2 style="margin-top:0">دخول الإدارة</h2><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="le"></div><button class="btn" id="lg" style="margin-top:14px;width:100%">دخول</button><p class="hint"><a href="index.html">العودة للموقع</a></p></div></div>

<div id="nb" style="display:none;background:#fff7e0;padding:8px 12px;text-align:center;font-size:13px">غير مربوط بـ GitHub: التعديلات تُحفظ في متصفحك فقط. <a href="#" id="nbl">اربط الآن</a></div>

<script src="content.js"></script>
<script>
const $=s=>document.querySelector(s);let D,tab='settings';
const msg=(t,ok=true)=>{const e=$('#st');e.textContent=t;e.style.background=ok?'#0d7a68':'#d93a4a';e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',5000)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){let c=window.SITE_CONTENT;try{const l=JSON.parse(localStorage.getItem('shift_last')||'null');if(l&&l.version>(c.version||0))c=l}catch(x){}return JSON.parse(JSON.stringify(c))}
const H=async(pw,salt)=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')};
const gh=()=>{try{return JSON.parse(localStorage.getItem('shift_gh')||'{}')}catch(x){return {}}};
const u8=s=>btoa(unescape(encodeURIComponent(s)));
const conn=()=>{const g=gh();return !!(g.owner&&g.repo&&g.token)};
const apiU=p=>{const g=gh();return `https://api.github.com/repos/${g.owner}/${g.repo}/contents/${p}`};
const hd=()=>({Authorization:'Bearer '+gh().token,Accept:'application/vnd.github+json'});
let ghQ=Promise.resolve();
function ghPut(path,b64,message){const run=()=>ghPut1(path,b64,message);const p=ghQ.then(run,run);ghQ=p.catch(()=>{});return p}
const shaMemo={};
async function ghPut1(path,b64,message){const g=gh(),br=g.branch||'main';let last='فشل غير معروف',hint=null;const tried=new Set();
 const getSha=async()=>{const r=await fetch(apiU(path)+'?ref='+encodeURIComponent(br)+'&_='+Date.now(),{headers:hd(),cache:'no-store'});return r.ok?(await r.json()).sha:undefined};
 for(let n=0;n<5;n++){let sha;
  if(n===0&&shaMemo[path]&&Date.now()-shaMemo[path].t<120000)sha=shaMemo[path].s;
  else if(hint&&!tried.has(hint))sha=hint;
  else sha=await getSha();
  tried.add(sha);
  const r=await fetch(apiU(path),{method:'PUT',headers:{...hd(),'Content-Type':'application/json'},body:JSON.stringify({message,content:b64,branch:br,sha})});
  if(r.ok){try{const j=await r.json();if(j.content&&j.content.sha)shaMemo[path]={s:j.content.sha,t:Date.now()}}catch(x){}return}
  let m='HTTP '+r.status;try{m=(await r.json()).message||m}catch(x){}last=m;
  if(r.status!==409&&r.status!==422)break;
  const hx=(m.match(/[0-9a-f]{40}/)||[])[0];hint=hx&&!tried.has(hx)?hx:null;delete shaMemo[path];
  await new Promise(z=>setTimeout(z,900*(n+1)))}
 throw new Error(last+' (تأكد أن لوحة الإدارة غير مفتوحة في تبويب أو جهاز آخر)')}
async function remote(){if(!conn()||window.PREVIEW)return null;const g=gh();try{const r=await fetch(apiU(g.path||'content.js')+'?ref='+encodeURIComponent(g.branch||'main')+'&_='+Date.now(),{headers:hd(),cache:'no-store'});if(!r.ok)return null;const j=await r.json();const t=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));return JSON.parse(t.slice(t.indexOf('=')+1).trim().replace(/;$/,''))}catch(x){return null}}
function guess(){const h=location.hostname,m=h.match(/^(.+)\.github\.io$/);if(!m)return {};const ps=location.pathname.split('/').filter(Boolean);return {owner:m[1],repo:ps.length&&!/\.html?$/.test(ps[0])?ps[0]:h}}
const setStat=t=>{const e=$('#stt');if(e)e.textContent=t};
function updateNb(){$('#nb').style.display=(!conn()&&!window.PREVIEW)?'':'none'}
const shrink=(f,mx=1200)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.onerror=()=>no(new Error('ملف الصورة غير صالح'));i.src=URL.createObjectURL(f)});
//SH_START
function imgErr(el){const n=(+el.dataset.r||0)+1;el.dataset.r=n;el.classList.add('bk');if(el.src.indexOf('data:')===0||n>8)return;const u=el.src.split('?')[0];setTimeout(()=>{el.classList.remove('bk');el.src=u+'?r='+Date.now()},8000)}
function bFrame(b,x){const u=esc(b.image),fx=+b.fx,fy=+b.fy,px=isNaN(fx)?50:fx,py=isNaN(fy)?30:fy,z=+b.zoom||1,al=esc(b.title||'');
return b.fit==='cover'?`<div class="bfr cov ${x||''}" style="--bi:url('${u}')"><img src="${u}" alt="${al}" draggable="false" onerror="imgErr(this)" style="object-position:${px}% ${py}%;transform:scale(${z});transform-origin:${px}% ${py}%"></div>`:`<div class="bfr full ${x||''}" style="--bi:url('${u}')"><img src="${u}" alt="${al}" draggable="false" onerror="imgErr(this)"></div>`}
function heroHTML(b,s,x){b=b||{};s=s||{};const sh=Math.max(0,Math.min(90,isNaN(+b.shade)?55:+b.shade))/100,pos=['l','c','r'].indexOf(b.textPos)>-1?b.textPos:'r';
const fr=b.image?bFrame(b):'<div class="bfr ph"></div>';
return `<div class="hb pos-${pos} ${x||''}" style="--s1:${sh};--s2:${(sh*0.5).toFixed(2)}">${fr}<div class="hov"><div class="hin"><span class="pill">أول حصة مجانية</span><h1>${esc(s.heroTitle)}</h1><p>${esc(s.heroText)}</p><div class="cta"><button class="btn" data-open="free">احجز حصتك التجريبية</button><a class="btn o" href="#courses">استكشف الكورسات</a><a class="btn t" data-wa href="#">اسألنا على واتساب</a></div><div class="chk"><span>تعليم عملي</span><span>شرح مبسط</span><span>مشروعات تطبيقية</span></div></div></div></div>`}
const pos=v=>(v==null||v===''||isNaN(+v))?50:+v;
const imgSt=o=>{const x=pos(o.ix),y=pos(o.iy),z=+o.iz>1?+o.iz:1;return `object-position:${x}% ${y}%;transform:scale(${z});transform-origin:${x}% ${y}%`};
function thumb(c){return c.image?`<div class="cw"><img class="ci" src="${esc(c.image)}" alt="${esc(c.title)}" loading="lazy" onerror="imgErr(this)" style="${imgSt(c)}"></div>`:''}
function cardHTML(x){return `<article class="cc">${thumb(x)}<div class="ctop"><span class="bdg">${esc(x.badge||'')}</span><span class="st st-${x.status==='متاح للتسجيل'?'on':'off'}">${esc(x.status)}</span></div><h3>${esc(x.title)}</h3><div class="lv">${esc(x.level)} &middot; ${esc(x.fmt)}</div><p>${esc(x.desc)}</p><ul>${(x.learn||[]).slice(0,3).map(l=>`<li>${esc(l)}</li>`).join('')}</ul><div class="meta"><span>${x.price?esc(x.price)+' ج.م':'السعر عند الاستفسار'}</span>${x.dur?'<span>'+esc(x.dur)+'</span>':''}</div><div class="row"><button class="btn full" data-q="free" data-id="${esc(x.id)}">احجز حصة مجانية</button><button class="btn o" data-d="${esc(x.id)}">التفاصيل</button><button class="btn o" data-q="info" data-id="${esc(x.id)}">استفسر</button></div></article>`}
const insImg=x=>x.image?`<img src="${esc(x.image)}" alt="${esc(x.name||x.role)}" loading="lazy" onerror="imgErr(this)" style="${imgSt(x)}">`:'AI';
const insSingle=x=>`<div class="two"><div class="av">${insImg(x)}</div><div>${x.name?`<div class="ln">${esc(x.name)}</div>`:''}<div class="rl">${esc(x.role)}</div>${x.bio?`<p class="sub" style="margin:8px 0 14px">${esc(x.bio)}</p>`:''}${x.philosophy?`<p style="margin:0 0 6px"><b>فلسفة التدريس:</b> ${esc(x.philosophy)}</p>`:''}${x.areas?`<p style="margin:0 0 22px"><b>مجالات الخبرة:</b> ${esc(x.areas)}</p>`:''}<button class="btn" data-open="free">احجز حصة تجريبية</button></div></div>`;
const insCard=x=>`<article class="ic"><div class="ph2">${insImg(x)}</div><div class="ib">${x.name?`<h3>${esc(x.name)}</h3>`:''}<div class="rl">${esc(x.role)}</div>${x.bio?`<p>${esc(x.bio)}</p>`:''}${x.areas?`<p><b>الخبرة:</b> ${esc(x.areas)}</p>`:''}</div></article>`;
//SH_END
const IC={};
const S=[['name','اسم الأكاديمية'],['waPhone','رقم واتساب (مثال 201001234567 أو 01001234567)'],['groupUrl','رابط جروب الواتساب'],['email','البريد الإلكتروني'],['workshopDate','موعد الورشة المجانية (فارغ = قريبًا)'],['inquiry','رسالة الاستفسار الافتراضية','area'],['heroTitle','عنوان أول الصفحة'],['heroText','النص تحت العنوان','area'],['aboutTitle','عنوان قسم المدرب (يظهر لو مدرب واحد فقط)']];
const INF=[['name','الاسم'],['role','الصفة (مثال: مهندس ذكاء اصطناعي، معلم برمجة)'],['areas','مجالات الخبرة'],['philosophy','فلسفة التدريس','area'],['bio','نبذة','area'],['image','الصورة','img'],['ix','موضع الصورة أفقيًا','range'],['iy','موضع الصورة رأسيًا','range'],['iz','تكبير الصورة (لقص جزء منها)','zoom'],['show','ظاهر في الموقع','bool']];
const CF=[['title','اسم الكورس'],['cat','الفئة','sel:kids|python|web|ai'],['badge','رمز قصير يظهر على الغلاف (مثل Py)'],['level','المستوى'],['desc','الوصف','area'],['learn','ما سيتعلمه (سطر لكل نقطة)','lines'],['fmt','الأسلوب (مباشر / مسجل / مباشر ومسجل)'],['dur','المدة'],['price','السعر بالجنيه (أرقام فقط)'],['status','الحالة','sel:متاح للتسجيل|قريبًا|قائمة انتظار'],['pre','المتطلبات'],['image','صورة الكورس','img'],['ix','موضع الصورة أفقيًا في البطاقة','range'],['iy','موضع الصورة رأسيًا في البطاقة','range'],['iz','تكبير الصورة (لقص جزء منها)','zoom'],['show','ظاهر في الموقع','bool']];
function fld(o,[k,l,t='']){const id='f'+Math.random().toString(36).slice(2);let h=`<label for="${id}">${l}</label>`;
 if(t==='area')h+=`<textarea id="${id}" rows="3">${esc(o[k])}</textarea>`;else if(t==='lines')h+=`<textarea id="${id}" rows="3">${esc((o[k]||[]).join('\n'))}</textarea>`;
 else if(t.startsWith('sel:'))h+=`<select id="${id}">${t.slice(4).split('|').map(v=>`<option ${o[k]===v?'selected':''}>${v}</option>`).join('')}</select>`;
 else if(t==='bool')h=`<label><input type="checkbox" id="${id}" ${o[k]!==false?'checked':''}> ${l}</label>`;
 else if(t==='zoom')h+=`<input type="range" min="1" max="3" step="0.05" id="${id}" value="${o[k]>1?o[k]:1}">`;
 else if(t==='range')h+=`<input type="range" min="0" max="100" id="${id}" value="${o[k]==null||o[k]===''?50:o[k]}">`;
 else if(t==='img')h+=`<input id="${id}" value="${esc(o[k])}" placeholder="رابط الصورة"><input type="file" accept="image/*" data-up="${id}" style="margin-top:6px">${o[k]?`<img class="pv" src="${esc(IC[o[k]]||o[k])}" alt="">`:''}<div class="hint">ارفع صورة أو الصق رابطًا.</div>`;
 else h+=`<input id="${id}" value="${esc(o[k])}">`;
 return {h,bind(){const el=document.getElementById(id);const f=()=>{o[k]=t==='bool'?el.checked:(t==='range'||t==='zoom')?+el.value:t==='lines'?el.value.split('\n').map(s=>s.trim()).filter(Boolean):el.value};el.addEventListener('input',f);el.addEventListener('change',f)}}}
function form(o,fs){const a=fs.map(f=>fld(o,f));return {h:a.map(x=>x.h).join(''),bind:()=>a.forEach(x=>x.bind())}}
function updPV(){document.querySelectorAll('[data-pvc]').forEach(el=>{const x=D.courses[+el.dataset.pvc];if(x)el.innerHTML='<div class="hint" style="margin-bottom:8px">معاينة البطاقة كما تظهر في الموقع</div>'+cardHTML(Object.assign({},x,{image:IC[x.image]||x.image}))});
 const n=(D.instructors||[]).filter(x=>x.show!==false).length;document.querySelectorAll('[data-pvi]').forEach(el=>{const x0=D.instructors[+el.dataset.pvi];if(!x0)return;const x=Object.assign({},x0,{image:IC[x0.image]||x0.image});el.innerHTML='<div class="hint" style="margin-bottom:8px">معاينة كما تظهر في الموقع</div>'+(n===1&&x.show!==false?insSingle(x):'<div class="ig" style="max-width:300px">'+insCard(x)+'</div>')})}
function show(){$('#pn').oninput=null;document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const p=$('#pn');let binds=[];
 if(tab==='settings'){const f=form(D.settings,S);p.innerHTML=`<div class="card">${f.h}</div>`;binds.push(f.bind)}
 else if(tab==='courses'){p.innerHTML=D.courses.map((c,i)=>{const f=form(c,CF);binds.push(f.bind);return `<div class="card"><b>${esc(c.title||'كورس جديد')}</b><div class="g2">${f.h}</div><div class="pvbox" data-pvc="${i}"></div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn o" data-m="up" data-i="${i}">أعلى</button><button class="btn o" data-m="dn" data-i="${i}">أسفل</button><button class="btn d" data-m="del" data-i="${i}">حذف</button></div></div>`}).join('')+'<button class="btn" data-m="add">إضافة كورس</button>'}
 else if(tab==='instructors'){if(!D.instructors)D.instructors=[{name:'',role:'مهندس ذكاء اصطناعي ومدرب',bio:D.settings.aboutBio||'',image:D.settings.aboutImage||'',areas:'',philosophy:'',show:true}];
 p.innerHTML='<p class="hint">يظهر كل مدرب في قسم المدربين بالموقع. مدرب واحد يظهر بتصميم كبير، وأكثر من مدرب يظهرون في بطاقات.</p>'+D.instructors.map((c,i)=>{const f=form(c,INF);binds.push(f.bind);return `<div class="card"><b>${esc(c.name||c.role||'مدرب جديد')}</b><div class="g2">${f.h}</div><div class="pvbox" data-pvi="${i}"></div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn o" data-m="iup" data-i="${i}">أعلى</button><button class="btn o" data-m="idn" data-i="${i}">أسفل</button><button class="btn d" data-m="idel" data-i="${i}">حذف</button></div></div>`}).join('')+'<button class="btn" data-m="iadd">إضافة مدرب</button>'}
 else if(tab==='banner'){const B=D.banner=Object.assign({image:'',fit:'full',fx:50,fy:30,zoom:1,textPos:'r',shade:55},D.banner||{});
 const fi=fld(B,['image','صورة البانر (ارفع صورة كبيرة، تُحفظ تلقائيًا بمجرد الرفع)','img']);
 p.innerHTML=`<div class="card"><h3 style="margin-top:0">البانر الكبير (الكلام يظهر فوق الصورة)</h3>${fi.h}<label for="bfit">طريقة عرض الصورة</label><select id="bfit"><option value="full">الصورة كاملة بدون أي قص</option><option value="cover">قص الصورة وتحديد الجزء الظاهر</option></select>
 <div id="bctl"><label for="bz">التكبير</label><input type="range" id="bz" min="1" max="3" step="0.05"><label for="bx">الموضع الأفقي</label><input type="range" id="bx" min="0" max="100"><label for="by">الموضع الرأسي</label><input type="range" id="by" min="0" max="100"><div class="hint">تقدر كمان تسحب الصورة داخل المعاينة بالإصبع أو الماوس.</div></div>
 <label for="bpos">مكان الكلام فوق الصورة</label><select id="bpos"><option value="r">يمين</option><option value="c">وسط</option><option value="l">يسار</option></select>
 <label for="bsh">درجة التظليل والتمويه خلف الكلام</label><input type="range" id="bsh" min="0" max="90"><div class="hint">زوّدها لو الكلام مش واضح على الصورة.</div></div>
 <div class="card"><b>معاينة كما سيراها الزائر</b><div id="bpv" style="margin-top:10px"></div><div class="hint">العنوان والنص بيتعدلوا من تبويب "الإعدادات والمحتوى".</div></div>`;
 binds.push(fi.bind);$('#bfit').value=B.fit;$('#bpos').value=B.textPos;$('#bsh').value=B.shade;$('#bz').value=B.zoom;$('#bx').value=B.fx;$('#by').value=B.fy;
 const rp=()=>{$('#bctl').style.display=B.fit==='cover'?'':'none';$('#bpv').innerHTML=`<div class="hint">الكمبيوتر</div>${heroHTML(Object.assign({},B,{image:IC[B.image]||B.image}),D.settings,'dsk')}<div class="hint" style="margin-top:14px">الهاتف</div><div class="mobv">${heroHTML(Object.assign({},B,{image:IC[B.image]||B.image}),D.settings,'mob')}</div>`};
 $('#pn').oninput=e=>{const t=e.target;if(t.id==='bz')B.zoom=+t.value;if(t.id==='bx')B.fx=+t.value;if(t.id==='by')B.fy=+t.value;if(t.id==='bsh')B.shade=+t.value;rp()};
 $('#pn').onchange=async e=>{if(e.target.id==='bfit'){B.fit=e.target.value;rp();return}if(e.target.id==='bpos'){B.textPos=e.target.value;rp();return}upl(e)};
 $('#bpv').onclick=e=>{if(e.target.closest('a,button'))e.preventDefault()};
 let dg=null;$('#bpv').onpointerdown=e=>{const f=e.target.closest('.hb');if(!f||B.fit!=='cover')return;dg={x:e.clientX,y:e.clientY,w:f.clientWidth,h:f.clientHeight};e.preventDefault()};
 window.onpointermove=e=>{if(!dg)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;dg.x=e.clientX;dg.y=e.clientY;B.fx=Math.max(0,Math.min(100,B.fx-dx/dg.w*100));B.fy=Math.max(0,Math.min(100,B.fy-dy/dg.h*100));$('#bx').value=B.fx;$('#by').value=B.fy;rp()};
 window.onpointerup=()=>{dg=null};rp()} else if(tab==='link'){const g=Object.assign(guess(),gh());p.innerHTML=`<div class="card" style="max-width:540px"><h3 style="margin-top:0">الربط مع GitHub (مرة واحدة فقط)</h3>${conn()?'<p style="color:#0d7a68;font-weight:700">متصل. كل تعديل يُنشر تلقائيًا على الموقع.</p>':''}
 <ol class="hint" style="line-height:2;padding-right:18px"><li>من GitHub: Settings ثم Developer settings ثم Personal access tokens ثم Fine-grained tokens ثم Generate new token</li><li>اختر Only select repositories وحدد مستودع الموقع</li><li>من Repository permissions اجعل Contents: Read and write</li><li>انسخ الـ Token والصقه هنا</li></ol>
 <label for="g1">اسم الحساب</label><input id="g1" value="${esc(g.owner)}"><label for="g2">اسم المستودع</label><input id="g2" value="${esc(g.repo)}"><label for="g5">Token</label><input id="g5" type="password" value="${esc(g.token)}" autocomplete="off">
 <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" id="gs">ربط</button>${conn()?'<button class="btn d" id="gx">فصل الربط</button>':''}</div></div>`;
 $('#gs').onclick=async()=>{if(window.PREVIEW)return msg('الربط غير متاح في المعاينة',false);const o=$('#g1').value.trim(),r=$('#g2').value.trim(),t=$('#g5').value.trim();if(!o||!r||!t)return msg('املأ كل الحقول',false);
  try{const x=await fetch(`https://api.github.com/repos/${o}/${r}`,{headers:{Authorization:'Bearer '+t}}),j=await x.json();if(!x.ok)return msg(j.message||'تعذر الاتصال، راجع البيانات',false);if(!(j.permissions&&j.permissions.push))return msg('الـ Token بدون صلاحية كتابة (Contents: Read and write)',false);
  localStorage.setItem('shift_gh',JSON.stringify({owner:o,repo:r,branch:j.default_branch||'main',path:'content.js',token:t}));updateNb();msg('تم الربط. جارٍ نشر المحتوى الحالي…');show();doSave(true)}catch(e){msg('فشل الاتصال: '+e.message,false)}};
 const gx=$('#gx');if(gx)gx.onclick=()=>{localStorage.removeItem('shift_gh');updateNb();msg('تم فصل الربط');show()}}
 else if(tab==='security'){p.innerHTML=`<div class="card" style="max-width:420px"><h3 style="margin-top:0">تغيير كلمة المرور</h3><label for="p1">كلمة المرور الحالية</label><input id="p1" type="password" autocomplete="current-password"><label for="p2">كلمة المرور الجديدة (6 أحرف على الأقل)</label><input id="p2" type="password" autocomplete="new-password"><label for="p3">تأكيد كلمة المرور الجديدة</label><input id="p3" type="password" autocomplete="new-password"><button class="btn" id="pc" style="margin-top:14px">تغيير كلمة المرور</button><p class="hint">بعد التغيير اضغط "حفظ".</p></div>`;
 $('#pc').onclick=async()=>{const s=D.settings;if(await H($('#p1').value,s.adminSalt)!==s.adminHash)return msg('كلمة المرور الحالية غير صحيحة',false);const n=$('#p2').value;if(n.length<6)return msg('الجديدة 6 أحرف على الأقل',false);if(n!==$('#p3').value)return msg('التأكيد غير مطابق',false);
 const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(v=>v.toString(16).padStart(2,'0')).join('');s.adminSalt=salt;s.adminHash=await H(n,salt);msg('تم تغيير كلمة المرور');show();queueSave()}}
 else{p.innerHTML=D.faq.map((q,i)=>{const f=form(q,[['q','السؤال'],['a','الإجابة','area']]);binds.push(f.bind);return `<div class="card">${f.h}<button class="btn d" data-m="delq" data-i="${i}" style="margin-top:10px">حذف</button></div>`}).join('')+'<button class="btn" data-m="addq">إضافة سؤال</button>'}
 binds.forEach(b=>b());updPV()}
$('#tb').innerHTML=[['settings','الإعدادات والمحتوى'],['banner','البانر'],['courses','الكورسات'],['instructors','المدربون'],['faq','الأسئلة الشائعة'],['link','الربط'],['security','الأمان']].map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('');
$('#tb').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;show()}};
$('#pn').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const i=+b.dataset.i,m=b.dataset.m,c=D.courses;
 if(m==='add')c.push({id:'c'+Date.now(),cat:'python',badge:'',title:'',level:'',desc:'',learn:[],fmt:'مباشر',dur:'',price:'',status:'قريبًا',pre:'',image:'',show:false});
 else if(m==='del'){if(!confirm('حذف هذا الكورس؟'))return;c.splice(i,1)}else if(m==='up'&&i>0)[c[i-1],c[i]]=[c[i],c[i-1]];else if(m==='dn'&&i<c.length-1)[c[i+1],c[i]]=[c[i],c[i+1]];
 else if(m==='iadd'){(D.instructors=D.instructors||[]).push({name:'',role:'معلم',bio:'',image:'',areas:'',philosophy:'',show:true})}else if(m==='idel'){if(!confirm('حذف هذا المدرب؟'))return;D.instructors.splice(i,1)}else if(m==='iup'&&i>0){const L=D.instructors;[L[i-1],L[i]]=[L[i],L[i-1]]}else if(m==='idn'&&i<D.instructors.length-1){const L=D.instructors;[L[i+1],L[i]]=[L[i],L[i+1]]} else if(m==='addq')D.faq.push({q:'',a:''});else if(m==='delq')D.faq.splice(i,1);show();queueSave()};
async function upl(e){const f=e.target.dataset&&e.target.dataset.up,file=e.target.files&&e.target.files[0];if(!f||!file)return;
 try{setStat('جارٍ رفع الصورة…');const d=await shrink(file,tab==='banner'?1800:1200);let url=d;
 if(conn()&&!window.PREVIEW){url='uploads/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';await ghPut(url,d.split(',')[1],'Upload image');IC[url]=d}
 const t=document.getElementById(f);t.value=url;t.dispatchEvent(new Event('input'));clearTimeout(qt);await doSave(true);show()}catch(x){setStat('فشل رفع الصورة');msg('فشل رفع الصورة: '+x.message,false)}}
$('#pn').onchange=upl;
$('#pn').addEventListener('click',e=>{if(e.target.closest('[data-pvc],[data-pvi]')&&e.target.closest('a,button'))e.preventDefault()});
['input','change'].forEach(ev=>$('#pn').addEventListener(ev,e=>{updPV();const t=e.target;if(t.type==='file'||/^(p1|p2|p3|g1|g2|g5)$/.test(t.id))return;queueSave()}));
function dlFile(){const txt='window.SITE_CONTENT = '+JSON.stringify(D,null,2)+';\n',l=document.createElement('a');l.href=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));l.download='content.js';l.click()}
let qt,chain=Promise.resolve();
function queueSave(){clearTimeout(qt);setStat('جارٍ الحفظ…');qt=setTimeout(()=>doSave(true),2000)}
function doSave(auto){return chain=chain.then(()=>run(auto)).catch(()=>{})}
async function run(auto){const bad=D.courses.find(c=>c.show!==false&&!String(c.title).trim());if(bad){setStat('أكمل اسم الكورس لإتمام الحفظ');return msg('أدخل اسمًا لكل كورس ظاهر',false)}
 D.version=(D.version||0)+1;const txt='window.SITE_CONTENT = '+JSON.stringify(D,null,2)+';\n';
 try{localStorage.setItem('shift_last',JSON.stringify(D))}catch(x){setStat('تعذر الحفظ');return msg('تعذر الحفظ لأن الصور كبيرة، جرّب صورة أصغر',false)}
 if(window.PREVIEW){window.onSaved(D);setStat('تم الحفظ (معاينة)');return}
 if(conn()){setStat('جارٍ النشر…');try{await ghPut(gh().path||'content.js',u8(txt),'Update site content');setStat('تم النشر، يظهر في الموقع خلال دقيقة تقريبًا');if(!auto)msg('تم النشر على GitHub')}catch(x){setStat('فشل النشر');msg('فشل النشر: '+x.message,false)}}
 else{setStat('محفوظ في المتصفح فقط (غير مربوط)');if(!auto)msg('تم الحفظ في المتصفح. اربط GitHub من تبويب الربط ليظهر للزوار')}}
$('#sv').onclick=()=>doSave(false);
$('#dlb').onclick=async()=>{await doSave(true);dlFile()};
async function enter(){D=load();const r=await remote();if(r&&r.version>=(D.version||0))D=r;$('#login').style.display='none';$('#app').style.display='block';updateNb();show()}
$('#lg').onclick=async()=>{$('#le').textContent='';if(!window.crypto||!crypto.subtle){$('#le').textContent='افتح الصفحة عبر https أو localhost';return}
 const s=load().settings;if(await H($('#pw').value,s.adminSalt||'')!==s.adminHash){$('#le').textContent='كلمة المرور غير صحيحة';return}try{sessionStorage.setItem('shift_adm','1')}catch(x){}enter()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lg').click()};
$('#nbl').onclick=e=>{e.preventDefault();tab='link';show()};
$('#lo').onclick=()=>{try{sessionStorage.removeItem('shift_adm')}catch(x){}if(window.PREVIEW)parent.closeAdmin();else location.reload()};
try{if(sessionStorage.getItem('shift_adm')==='1')enter()}catch(x){}
</script></body></html>
